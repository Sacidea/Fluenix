name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate
        
      - name: Run Tests
        run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile -t fluenix-backend:latest .
        
      - name: Build AI Service Docker Image
        run: docker build -f apps/ai-service/Dockerfile -t fluenix-ai-service:latest apps/ai-service
